name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Test-only values, not real secrets. Both URLs point at the same postgres
  # service container defined below; TEST_DATABASE_URL is what tests/conftest.py
  # reads for the pytest fixture DB (kept distinct from DATABASE_URL so the app's
  # own runtime config and the test suite's DB choice are never silently conflated).
  DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/ci_db
  TEST_DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/ci_db
  SECRET_KEY: ci-test-secret-key-not-for-production-use-only

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run pytest
        run: |
          pytest || { code=$?; [ "$code" -eq 5 ] && echo "No tests collected yet (expected pre-Phase 8)." || exit "$code"; }

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
